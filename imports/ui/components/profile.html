<template name="profileAvatar">
    {{#with user this}}
        {{#with img profile.picture profile.name}}
            <img class="ui avatar image" title="{{profile.name}}" src="{{this}}">
        {{else}}
            <div class="ui inverted tiny header">
                <i class="user icon"></i>
                <div class="content"> {{profile.name}}</div>
            </div>
        {{/with}}
    {{/with}}
</template>
