<template name="formatDropdown">
    <div id="formats" class="ui dropdown item">
        <div class="text">File Format</div>
        <input type="hidden" name="template" value="{{default}}">
        <i class="dropdown icon"></i>

        <div class="menu">
            <div class="item" data-value="csv">.csv</div>
            <div class="item" data-value="xls">.xls</div>
            <div class="item" data-value="xlsx">.xlsx</div>
        </div>
    </div>
</template>
