<template name="adminPanel">
    {{#with currentUser}}{{> userCard}}{{/with}}

    {{#with clients}}
        <div class="ui basic compact segment">
            <h2 class="ui inverted header">Current Messaging Client(s)</h2>
            <div id="clients" class="ui cards">{{> clientList}}</div>
        </div>
    {{else}}
        <div class="ui basic disabled inverted card">
            <div class="content">
                <a class="ui centered inverted icon header">
                    <i class="unlink icon"></i> No Connected Devices
                    <span class="sub header">Register a device for networking info</span>
                </a>
            </div>
        </div>
    {{/with}}
</template>

<template name="clientList">
    {{#each this}}
        <div class="ui inverted card">
            <div class="content">
                {{#let c=(clientStatus state 'color') i=(clientStatus state 'color,icon') dt=(relativeDate updatedAt false)}}
                    <div class="ui inverted {{c}} header">
                        <i class="right floated inverted {{clientStatus state 'actions,color'}}circle icon"
                           title="{{_id}} is {{#if $eq state 'maintenance'}}undergoing {{/if}}{{state}}"></i>

                        {{_id}}
                    </div>

                    <div class="meta">
                        <div class="ui fluid inverted mini buttons">
                            {{#unless disabled state}}
                                <button id="connect-{{_id}}" class="ui button" type="button" value="{{_id}}">Connect</button>
                                <div class="or"></div>
                                <button id="disconnect-{{_id}}" class="ui grey button" type="button" value="{{_id}}">Disconnect</button>
                            {{else}}
                                {{#let tt=(clientStatus state 'tooltip') m=(clientStatus state 'message') p=(clientStatus state 'params')}}
                                    <button class="ui basic inverted {{c}} icon button" type="button" data-inverted
                                            data-variation="mini {{c}}" data-tooltip="{{tt}}{{dt}}">
                                        <i class="{{i}} icon"></i> <em><span class="ui inverted {{c}} text">{{m}}</span>&nbsp;&nbsp;{{p}}</em>
                                    </button>
                                {{/let}}
                            {{/unless}}
                        </div>
                    </div>

                    <div class="description">
                        <div class="ui very relaxed mini inverted list">
                            <div class="item">
                                <i class="hourglass icon"></i>
                                <div class="content">
                                    last seen: <em><span class="right floated">{{relativeDate lastSeen false}}</span></em>
                                </div>
                            </div>

                            {{#if issues}}
                                <div class="item">
                                    <div class="ui left floated inverted {{c}} header">Issues:</div>

                                    <div class="ui basic mini horizontal inverted labels">
                                        {{#each issues}}
                                            <a class="ui olive label"><i class="bug icon"></i> {{type}}: <em>{{desc}}</em></a>
                                        {{/each}}
                                    </div>
                                </div>
                            {{/if}}
                        </div>
                    </div>
                {{/let}}
            </div>
        </div>
    {{/each}}
</template>

<template name="experimentItem">
    <div class="{{#if hidden _id}}disabled{{/if}} comment" style="pointer-events: auto;">
        <a class="avatar">{{> profileAvatar (investigator.id)}}</a>

        <div class="content">
            <div class="author">
                <div class="right floated metadata">/{{replace link '/experiments/' ''}}</div>
                {{title}}
            </div>

            <div class="actions">
                <a class="visibility">
                    {{#unless hidden _id}}
                        <i class="eye slash icon"></i>Hide
                    {{else}}
                        <i class="eye icon"></i>Show
                    {{/unless}}
                </a>

                <a class="edit right floated">
                    <i class="edit icon"></i>Edit
                </a>
            </div>
        </div>
    </div>
</template>

<template name="experimentList">
    <div id="experiments" class="ui mini inverted threaded comments">
        {{#each authorized experiments}}
            {{> experimentItem}}
        {{/each}}
    </div>

    {{> experimentModal (editing)}}
</template>

<template name="experimentModal">
    <div id="modal-experiment-{{link}}" class="ui compact inverted grey message modal">
        <i class="close icon"></i>

        <div class="ui inverted grey dividing header">
            <i class="edit icon"></i>

            <span class="content">
                Editing "<span class="ui italicized info text">{{title}}</span>"
            </span>
        </div>

        <div class="scrolling content">
            {{> editExperimentForm}}
        </div>

        <div class="basic centered actions">
            <div class="ui negative icon button">
                <i class="trash icon"></i>
            </div>

            <button class="ui positive left labeled icon button">
                <i class="save icon"></i> Save All
            </button>
        </div>
    </div>
</template>

<template name="userCard">
    {{#with profile}}
        <div class="ui right floated basic compact segment" style="border-radius: 0.3rem;">
            <div class="ui inverted card">
                {{#if edit}}
                    <input type="file" id="upload-file" class="ui invisible file input" name="file">
                {{/if}}

                <label for="upload-file" class="ui center aligned image {{#if edit}}ui looping pulsating transition{{/if}}">
                    {{#with img name}}
                        <img id="user" src="{{this}}">
                    {{else}}
                        <div class="ui inverted placeholder"><div class="square image"></div></div>
                    {{/with}}

                    <div class="ui dimmer">
                        <div class="content">
                            <h2 class="ui inverted icon header">
                                <i class="image folder icon"></i> Upload a Photo
                            </h2>
                        </div>
                    </div>
                </label>

                <div class="content">
                    {{#if edit}}
                        {{> userForm}}
                    {{else}}
                        <button id="edit-user" class="ui right floated secondary icon button" style="margin: -0.9em;">
                            <i class="edit icon"></i>
                        </button>

                        <div class="header">{{name}}</div>

                        <div class="description">
                            <div class="ui inverted list">
                              <div class="item">
                                <i class="user icon"></i>
                                <div class="content">
                                    username:

                                    <div class="right floated content">
                                         <span class="ui info text">{{username}}</span>
                                    </div>
                                </div>
                              </div>

                              <div class="item">
                                <i class="mail icon"></i>
                                <div class="content">
                                  email:

                                    <div class="right floated content">
                                         {{#if email}}<a href="mailto:{{email}}">{{email}}</a>
                                         {{else}}<span class="ui info text">none</span>{{/if}}
                                    </div>
                                </div>
                              </div>

                              <div class="item">
                                <i class="hourglass icon"></i>
                                <div class="content">
                                    last login:

                                    <div class="right floated content">
                                         <span class="ui info text">{{relativeDate status.lastLogin.date false}}</span>
                                    </div>
                                </div>
                              </div>
                            </div>

                            <div class="ui horizontal divider">
                                <div class="ui tiny horizontal teal inverted statistic">
                                    <div class="value">{{getLength experiments}}</div>
                                    <div class="label">experiments <i class="teal vial icon"></i></div>
                                </div>
                            </div>

                            <div class="ui very short inverted scrolling segment">
                                {{> experimentList}}
                            </div>
                        </div>
                    {{/if}}
                </div>
            </div>
        </div>
    {{/with}}
</template>
