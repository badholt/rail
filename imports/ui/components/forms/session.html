<template name="sessionForm">
    <form id="session-form" class="ui equal width inverted form">
        <div class="fields">
            <div class="field">
                <label>
                    Delay (before session start)
                    <span class="ui mini horizontal label">ms</span>
                </label>
                <input type="number" name="session.delay"
                       min="0" placeholder="#" value="{{delay}}">
            </div>
            <div class="field">
                <label>
                    Intertrial Interval (ITI)
                    <span class="ui mini horizontal label">ms</span>
                </label>
                <input type="number" name="session.iti"
                       min="0" placeholder="#" value="{{iti}}">
            </div>
            {{#if light}}
                <div class="field">
                    <label>
                        Light Duration
                        <span class="ui mini horizontal label">ms</span>
                    </label>
                    <input type="number" name="light.duration"
                           min="0" placeholder="#" value="{{light.duration}}">
                </div>
            {{/if}}
        </div>

        <div class="fields">
            <div class="field">
                <label>
                    Duration
                    <span class="ui mini horizontal label">ms</span>
                </label>
                <input type="number" name="session.duration"
                       min="0" placeholder="#" value="{{duration}}">
            </div>

            <div class="field">
                <label>No. of Trials</label>
                <input type="number" name="session.total" min="0" placeholder="#" value="{{total}}">
            </div>
        </div>

        <div class="ui horizontal inverted divider">Stimuli Probability Distribution Specifications</div>


        {{#if distribution}}
            <div class="ui inverted mini message">
                <div class="ui horizontal inverted list">
                    <div class="item">
                        <i class="disabled right triangle icon"></i>

                        <div class="content">
                            <div class="header" title="Total number of trials in a distribution given a multiplier of one">
                                base no. trials

                                <div class="description">
                                    <label class="ui mini grey inverted horizontal label">{{base}}</label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="item">
                        <i class="disabled right triangle icon"></i>

                        <div class="content">
                            <div class="header" title="Generated sample given current parameters">
                                sample distribution

                                <div class="description">
                                    {{#each sample distribution.ratio distribution.size}}
                                        <label class="ui mini {{color}} inverted horizontal label">
                                            {{variable}} <span class="detail">{{weight}} trials</span>
                                        </label>
                                    {{/each}}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="fields">
                <div class="{{#unless modify}}disabled{{/unless}} field">
                    <label>Trials Multiplier</label>
                    <input type="number" name="session.distribution.multiplier"
                           min="1" step="0.00001" placeholder="#" value="{{distribution.multiplier}}">
                </div>

                <div class="{{#unless modify}}disabled{{/unless}} field">
                    <label>Distribution Size <span class="ui mini horizontal label">Trials</span></label>
                    <input type="number" name="session.distribution.size" min="0" placeholder="#" value="{{distribution.size}}">
                </div>

                <div class="inline field">
                    <div class="ui toggle inverted checkbox">
                      <input type="checkbox" tabindex="0" class="hidden">
                      <label>Modify Base Size</label>
                    </div>
                </div>
            </div>

            <div class="fields">
                <div class="field">
                    <label>Orientation Ratio <span class="ui mini horizontal label">% Vertical</span></label>
                    <input type="number" name="session.distribution.ratio"
                           min="0" max="1" step="0.01"
                           placeholder="#" value="{{distribution.ratio}}">
                </div>

                <div class="disabled field">
                    <label>Orientation Ratio <span class="ui mini horizontal label">% Horizontal</span></label>
                    <input type="number" step="0.01" value="{{remainder distribution.ratio}}">
                </div>

                <div class="disabled field">
                    <label>Max No. Repeats <span class="ui mini horizontal label">Trials</span></label>
                    <input type="number" name="session.distribution.repeats" min="0" placeholder="#" value="{{distribution.repeats}}">
                </div>
            </div>
        {{/if}}
    </form>
</template>
