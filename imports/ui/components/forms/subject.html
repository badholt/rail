<template name="subjectForm">
    <form id="subject-form" class="ui inverted form">
        <div class="ui huge green dividing header">
            <i class="icons">
                <i class="green paw icon"></i>
                <i class="corner inverted add icon"></i>
            </i>

            {{#if identifier}}
                {{identifier}}
            {{else}}
                New Subject
            {{/if}}
        </div>

        <div class="four fields">
            <div class="required field">
                <label>Identifier</label>
                <input name="identifier" placeholder="ex: M16" type="text" value={{identifier}}>
            </div>

            <div class="field">
                <label>Name</label>
                <input name="name" placeholder="ex: Toffee" type="text" value={{name}}>
            </div>

            <div class="required field">
                <label>Strain</label>

                <div class="ui search selection dropdown">
                    <input type="hidden" name="strain" value="{{strain}}">
                    <i class="dropdown icon"></i>
                    <div class="default text">ex: c57BL/6</div>

                    <div class="menu">
                        {{#each strains}}
                            <div class="item" data-value="{{value}}">{{name}}</div>
                        {{/each}}
                    </div>
                </div>
            </div>

            <div class="field">
                <label>Protocol</label>
                <input name="protocol" placeholder="ex: MO17A81" type="text" value={{protocol}}>
            </div>
        </div>

        <div class="three fields">
            <div class="required field">
                <label>Birthday</label>

                <div class="ui inverted calendar">
                  <div class="ui input left icon">
                    <input name="birthday" type="text" placeholder="Birthday" value="{{bday}}">
                    <i class="calendar icon"></i>
                  </div>
                </div>
            </div>

            <div class="required field">
                <label>Age</label>

                {{#with age bday units}}
                    <div class="ui right labeled input">
                        <input name="age" step="any" type="number" placeholder="ex: 8" value="{{formatDecimal amount 3}}">

                        <div id="units" class="ui dropdown label">
                            <input name="unit" type="hidden" value="{{unit}}">
                            <div class="default text">units</div>
                            <i class="dropdown icon"></i>

                            <div class="menu">
                                {{#each timespan}}
                                    <div class="item" data-value="{{this}}">{{this}}</div>
                                {{/each}}
                            </div>
                        </div>
                    </div>
                {{/with}}
            </div>

            <div class="required field">
                <label>Sex</label>

                <div class="ui search selection dropdown">
                    <input type="hidden" name="sex" value="{{sex}}">
                    <i class="dropdown icon"></i>
                    <div class="default text">ex: Female</div>

                    <div class="menu">
                        <div class="item" data-value="f">
                            <i class="pink venus icon"></i> Female
                        </div>
                        <div class="item" data-value="m">
                          <i class="blue mars icon"></i> Male
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="two fields">
            <div class="field">
                <label>Participation</label>

                <div class="ui fluid multiple search selection dropdown">
                    <input type="hidden" name="experiments" value="{{experiments}}">
                    <i class="dropdown icon"></i>
                    <div class="default text">Experiments</div>

                    <div class="menu">
                        {{#each participation}}
                            <div class="item" data-value="{{_id}}">{{title}}</div>
                        {{/each}}
                    </div>
                </div>
            </div>

            <div class="field">
                <label>Tags</label>

                <div id="tags" class="ui fluid multiple search selection dropdown">
                    <input type="hidden" name="tags" value="{{tags}}">
                    <i class="dropdown icon"></i>
                    <div class="default text">Enter tags</div>

                    <div class="menu">
                        {{#each tags}}
                            <div class="item" data-value="{{this}}">{{this}}</div>
                        {{/each}}
                    </div>
                </div>
            </div>
        </div>

        <div class="field">
            <label>Description</label>
            <textarea autocomplete="off" name="description" placeholder="Miscellaneous commentary" rows="2">{{description}}</textarea>
        </div>

        <div class="ui inverted error message"></div>
        <button class="ui fluid green icon submit button" type="button"><i class="check icon"></i></button>
    </form>
</template>
