<template name="crossForm">
    {{#with value}}
        <form id="cross-form" class="ui inverted form">
            {{#if visible}}{{> crossPreview}}{{/if}}

            <label>Offset <span class="ui mini horizontal label">% from center</span></label>

            <div class="two fields">
                <div class="field">
                    <div class="ui inverted transparent right labeled input">
                        <div class="ui inverted brown right pointing label">
                            x
                        </div>
                        <input type="number" name="offset-x" placeholder="0.0"
                               value="{{offset.x}}" max="1.0" min="-1.0" step="0.1">
                    </div>
                </div>
                <div class="field">
                    <div class="ui inverted transparent right labeled input">
                        <div class="ui inverted brown right pointing label">
                            y
                        </div>
                        <input type="number" name="offset-y" placeholder="0.0"
                               value="{{offset.y}}" max="1.0" min="-1.0" step="0.1">
                    </div>
                </div>
            </div>

            <div class="two fields">
                <div class="field">
                    <label>
                        Span (Size)
                        <span class="ui mini horizontal label">pixels</span>
                    </label>
                    <input type="number" name="span"
                           placeholder="#" value="{{span}}">
                </div>
                <div class="field">
                    <label>
                        Weight (Thickness)
                        <span class="ui mini horizontal label">pixels</span>
                    </label>
                    <input type="number" name="weight"
                           placeholder="#" value="{{weight}}">
                </div>
            </div>

            <div class="two fields">
                <div class="field">
                    <label>
                        Delay
                        <span class="ui mini horizontal label">ms</span>
                    </label>
                    <input type="number" name="delay"
                           placeholder="#" value="{{delay}}">
                </div>
                <div class="field">
                    <label>
                        Duration
                        <span class="ui mini horizontal label">ms</span>
                    </label>
                    <input type="number" name="duration"
                           placeholder="#" value="{{duration}}">
                </div>
            </div>
        </form>
    {{/with}}
</template>

<template name="crossPreview">
    <svg id="cross-preview" width="100%" style="aspect-ratio: 5 / 3;">
        {{#with screen}}
            <text x="20" y="20" class="filled orange">{{width}}px</text>
            <text x="10" y="20" class="vertical filled blue">{{height}}px</text>
        {{/with}}

        {{#with preview this}}{{> cross}}{{/with}}
    </svg>
</template>
