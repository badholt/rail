<template name="trial">
    {{abort}}

    {{#with session}}
        {{#with data settings stage trials}}
            {{> trialSVG inputs=../settings.inputs trial=this}}
        {{/with}}
    {{/with}}
</template>

<template name="trialElements">
    {{#each element}}
        {{> trialElement e=this i=@index}}
    {{/each}}

    {{#each responses}}
        {{> trialElement e=this i=@index}}
    {{/each}}
</template>

<template name="trialSVG">
    <svg width="100%" height="100%">
        {{#with elements stage trial}}
            {{> trialElements element=this stage=../stage trial=../trial.number}}
        {{/with}}

        {{ir stage trial}}
    </svg>
</template>

<template name="trialElement">
    {{#with e}}
        {{#if $eq type 'audio'}}
            {{audio stage trial}}
        {{/if}}
        {{#if $eq type 'cross'}}
            {{#if timer delay duration type ../i}}
                {{> cross}}
            {{/if}}
        {{/if}}
        {{#if $eq type 'stimuli'}}
            {{#if timer delay duration type ../i}}
                {{> bars center=center data=this}}
            {{/if}}
        {{/if}}
        {{#if $in type 'board' 'lights' 'reward'}}
            {{command stage trial}}
        {{/if}}
    {{/with}}
</template>
