<template name="settingsForm">
    <form id="settings-form" class="ui inverted form">
        <div class="ui equal width fields">
            <div class="field">
                <label>Authorized Users</label>
                {{> authorizedDropdown}}
            </div>
        </div>

        <div class="field">
            <label>Associated Template(s)</label>
            {{> templateList}}
        </div>

        <button class="ui black fluid button" type="submit">Save</button>
		
		{{> clientList}}
    </form>
</template>

<template name="clientList">
	<div id="clients" class="ui compact segments">
		{{#each users}}
      		{{#each clients status.client}}
    			<div class="ui black inverted segment">
    				<i class="{{#if connected}}{{#if disconnecting}}red loading notched {{else}}green {{/if}}{{else}}{{#if disconnected}}{{#if reconnecting}}green loading notched {{else}}red {{/if}}{{/if}}{{/if}}circle icon"></i>
    				<span class="ui {{#if ../status.online}}green{{else}}red{{/if}} inverted header">{{../profile.name}}</span> ({{options.clientId}})
    				<br>

    				<div class="ui mini buttons">
    					<button id="connect-{{options.clientId}}" class="ui black button" type="button" value="{{options.clientId}}">Connect</button>
    					<button id="disconnect-{{options.clientId}}" class="ui black button" type="button" value="{{options.clientId}}">Disconnect</button>
    				</div>
    			</div>
    		{{/each}}
		{{/each}}
	</div>
</template>

<template name="templateList">
    <div class="ui middle aligned divided inverted list">
        {{#each templates}}
            {{> templateItem}}
        {{/each}}
    </div>
</template>

<template name="templateItem">
    <div class="item">
        <div class="ui inverted segment">
            <div class="right floated content">
                <i class="{{#if current _id}}yellow{{/if}} link star icon"></i>
                <i class="{{#if default users}}disabled {{else}}link {{/if}}delete icon"></i>
            </div>

            <div class="content">
                <div class="description">{{#each users}}{{> profileAvatar this}}{{/each}}</div>
                <div class="header">{{#if name}}{{name}}{{/if}}</div>
            </div>
        </div>
    </div>
</template>
