<template name="calibrate">
    {{#with currentUser.status.active.calibration.cross}}
        {{> calibrationView}}
    {{/with}}
</template>

<template name="calibrationView">
    {{> crossPreview}}
</template>

<template name="audioCalibrationForm">
    <div id="audio-calibration-form" class="ui inverted form">
        <div class="two fields">
            <div class="disabled field">
                <div class="ui right labeled input">
                    <label for="volume" class="ui blue right pointing mini label">Volume:</label>
                    <input name="volume" type="number" value="{{volume}}" disabled>
                    <span class="ui mini label">dB</span>
                </div>
            </div>

            <div class="orange outlined field">
                <div class="ui right labeled input">
                    <label for="frequency" class="ui blue right pointing mini label">Frequency Offset:</label>
                    <input name="frequency" type="number" value="{{frequency}}" autofocus="autofocus">
                    <span class="ui mini label">Hz</span>
                </div>

                <i class="fixed right ui circular inverted orange link warning icon" title="This will modify the tone wave frequencies specified by any template!"></i>
            </div>
        </div>
    </div>
</template>

<template name="audioCalibrationModal">
    <div id="modal-calibrate-{{profile.username}}" class="ui basic modal">
        <div class="header">Calibrate Audio for {{profile.name}}</div>
        <div class="content">
            {{> audioCalibrationForm (settings)}}
        </div>

        <div class="actions">
            <button class="ui positive right labeled icon button">Save to {{profile.name}}<i class="checkmark icon"></i></button>
        </div>
    </div>
</template>

<template name="screenCalibrationForm">
    <form id="calibration-form" class="ui inverted form">
        {{#with offsets 'cross'}}
            <div class="orange outlined">
                <label>Offset <span class="ui mini horizontal label">% from center</span></label>
                <div class="two fields">
                    <div class="field">
                        <div class="ui inverted transparent input">
                            <div class="ui large orange right pointing label">
                                x
                            </div>
                            <input type="number" name="offset-x" placeholder="0.0"
                                   value="{{offset.x}}" max="1.0" min="-1.0" step="0.01">
                        </div>
                    </div>
                    <div class="field">
                        <div class="ui inverted transparent input">
                            <div class="ui large blue right pointing label">
                                y
                            </div>
                            <input type="number" name="offset-y" placeholder="0.0"
                                   value="{{offset.y}}" max="1.0" min="-1.0" step="0.01">
                        </div>
                    </div>

                    <i class="ui circular inverted orange link warning icon" title="This will modify the offset already applied by the template!"></i>
                </div>
            </div>
        {{/with}}

        <div class="two fields">
            <div class="field">
                <label>
                    Span (Size)
                    <span class="ui mini horizontal label">pixels</span>
                </label>
                <input type="number" name="span"
                       placeholder="#" value="{{span}}">
            </div>
            <div class="field">
                <label>
                    Weight (Thickness)
                    <span class="ui mini horizontal label">pixels</span>
                </label>
                <input type="number" name="weight"
                       placeholder="#" value="{{weight}}">
            </div>
        </div>
    </form>
</template>

<template name="screenCalibrationModal">
    <div id="modal-calibrate-{{profile.username}}" class="ui basic modal">
        <div class="header">Calibrate Screen for {{profile.name}}</div>
        
        <div class="scrolling content">
            {{#with preview 'cross'}}
                {{> crossPreview}}
                {{> screenCalibrationForm}}
            {{/with}}
        </div>

        <div class="actions">
            {{> offsetDropdown}}

            <button class="ui positive right labeled icon button">Save to {{profile.name}}<i class="checkmark icon"></i></button>
        </div>
    </div>
</template>

<template name="waterCalibrationForm">
    <div id="water-calibration-form" class="ui inverted form">
        <div class="two fields">
            <div class="disabled orange outlined field">
                <div class="ui right labeled input">
                    <label for="amount" class="ui blue right pointing mini label">Amount Offset:</label>
                    <input name="amount" step="0.001" type="number" value="{{amount}}">
                    <span class="ui mini label">mL</span>
                </div>

                <i class="fixed left ui circular inverted orange link warning icon" title="This will modify the initial water reward amount calculated using the water curve!"></i>
            </div>

            <div class="orange outlined field">
                <div class="ui right labeled input">
                    <label for="dispense" class="ui blue right pointing mini label">Time Offset:</label>
                    <input name="dispense" min="0" step="0.001" type="number" value="{{dispense}}">
                    <span class="ui mini label">s</span>
                </div>

                <i class="fixed right ui circular inverted orange link warning icon" title="This will modify the dispense time specified by any template!"></i>
            </div>
        </div>
        <div class="disabled inline fields">
            <label>Water Curve:  <label class="ui black label">f(x) = </label></label>

            <div class="field">
                <div class="ui left labeled input">
                    <label for="slope" class="ui blue right pointing label">slope (m)</label>
                    <input name="slope" step="0.001" type="number" value="{{slope}}">
                </div>
            </div>

            <label><label class="ui black label"> * x + </label></label>

            <div class="field">
                <div class="ui left labeled input">
                    <label for="intercept" class="ui blue right pointing label">intercept (b)</label>
                    <input name="intercept" step="0.001" type="number" value="{{intercept}}">
                </div>
            </div>
        </div>
    </div>
</template>

<template name="waterCalibrationModal">
    <div id="modal-calibrate-{{profile.username}}" class="ui basic modal">
        <div class="header">Calibrate Water for {{profile.name}}</div>
        <div class="content">
            {{> waterCalibrationForm (settings)}}
        </div>

        <div class="actions">
            <button class="ui positive right labeled icon button">Save to {{profile.name}}<i class="checkmark icon"></i></button>
        </div>
    </div>
</template>
