<template name="subjectPanel">
    <div id="panel" class="ui equal width padded stackable grid">
        <div class="row">
            <div class="column">
                <div class="ui basic centered cards container">
                    {{#each subjects}}
                        {{> subjectCard}}
                    {{/each}}
                </div>
            </div>

            <div class="two wide right floated column">
                <span id="add-subject" class="ui huge black icon button">
                    <i class="icons">
                        <i class="grey paw icon"></i>
                        <i class="grey corner inverted add icon"></i>
                    </i>
                    New Subject
                </span>
            </div>
        </div>

        {{#if subject}}{{> subjectModal (subject)}}{{/if}}
    </div>
</template>

<template name="subjectCard">
    <div class="ui grey {{#unless user users}}disabled {{/unless}}card">
        <div class="center aligned content">
            {{#if user users}}<i class="right floated grey link edit icon"></i>{{/if}}

            <div class="ui tiny icon header">
                <i class="{{#if user users}}green{{else}}grey{{/if}} inverted large circular paw icon"></i>

                {{identifier}}

                <span class="sub header">
                    {{#if name}}"{{name}}"{{/if}}
                </span>
            </div>

            <div class="meta">
                <div class="ui labels">
                    <div class="ui label">
                        <i class="dna icon"></i>
                        {{strain}}
                    </div>

                    <div class="ui label">
                        <i class="{{#if $eq sex 'F'}}venus{{else}}mars{{/if}} icon"></i>
                    </div>

                    <div class="ui label">
                        <i class="birthday icon"></i>
                        {{relativeDate birthday true}} old
                    </div>
                </div>
            </div>

            <div class="description">
                {{#if description}}
                    <div class="ui grey inverted segment">
                        {{description}}
                    </div>
                {{/if}}

                <div class="ui grey inverted segment">
                    <div class="ui labels">
                        {{#each experiment experiments}}
                            <a class="ui label" href="{{link}}">
                                <i class="linkify icon"></i>
                                {{title}}
                            </a>
                        {{/each}}
                    </div>
                </div>
            </div>
        </div>

        <div class="extra content">
            <div class="ui mini green labels">
                {{#each tags}}
                    <label class="ui tag label">
                        {{this}}
                    </label>
                {{/each}}
            </div>

            <span class="left floated">
                <i class="clipboard list icon"></i>
            {{protocol}}
            </span>

            <span class="right floated">
                <i class="clock icon"></i>
                last session
            </span>
        </div>
    </div>
</template>

<template name="subjectModal">
    <div id="subject-modal" class="ui inverted modal">
        <i class="close icon"></i>

        <div class="content">
            {{> subjectForm}}
        </div>
    </div>
</template>
